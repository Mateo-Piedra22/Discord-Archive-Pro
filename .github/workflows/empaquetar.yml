# Empaquetado del .exe de Windows.
# Se lanza a mano desde Actions o al publicar una etiqueta `v*`.
# El artefacto queda descargable desde la ejecución del workflow.
name: Empaquetar Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: empaquetar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  empaquetar:
    name: Estrato.exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Dependencias
        run: npm ci

      - name: Tipos y tests
        run: |
          npm run typecheck
          npm test

      - name: Empaquetar
        run: npx electron-builder --win portable --publish never

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v5
        with:
          name: Estrato-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
