# Verificación continua en cada push y pull request hacia main.
# Valida tipos, tests, compilación y auditoría de recursos en Linux sin empaquetar.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, tests, build y lanzamiento
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Sin scripts de instalación: la verificación no necesita compilar
      # módulos nativos (better-sqlite3) ni descargar Electron.
      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Tipos
        id: typecheck
        run: npm run typecheck

      - name: Tests
        id: test
        run: npm test -- --run

      - name: Build
        id: build
        run: npm run build

      - name: Verificar lanzamiento y recursos
        id: verify
        run: npm run verify:release

      - name: Resumen de verificación
        if: always()
        env:
          OUTCOME_TYPECHECK: ${{ steps.typecheck.outcome }}
          OUTCOME_TEST: ${{ steps.test.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_VERIFY: ${{ steps.verify.outcome }}
        run: |
          node --input-type=module << 'EOF'
          import fs from 'node:fs'
          import {
            validateElectronSecurityConfig,
            validateIcoBuffer,
            validatePngBuffer,
            validateSvgContent
          } from './scripts/verify-release.mjs'

          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          if (!summaryPath) process.exit(0)

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))

          const checkPng = (file) => {
            if (!fs.existsSync(file)) return 'ausente'
            const res = validatePngBuffer(fs.readFileSync(file), 512)
            return res.ok ? `${res.width}x${res.height} RGBA` : `error (${res.error})`
          }

          const checkIco = (file) => {
            if (!fs.existsSync(file)) return 'ausente'
            const res = validateIcoBuffer(fs.readFileSync(file), 5)
            return res.ok ? `${res.count} tamaños (${res.sizes.join(', ')})` : `error (${res.error})`
          }

          const checkSvg = (file) => {
            if (!fs.existsSync(file)) return 'ausente'
            const res = validateSvgContent(fs.readFileSync(file, 'utf8'))
            return res.ok ? 'SVG seguro y válido' : `error (${res.error})`
          }

          const checkElectronSecurity = (file) => {
            if (!fs.existsSync(file)) return 'ausente'
            const res = validateElectronSecurityConfig(fs.readFileSync(file, 'utf8'))
            return res.ok
              ? 'nodeIntegration: false · contextIsolation: true · sandbox: true · webSecurity: true'
              : `error (${res.errors.join('; ')})`
          }

          const fontFile = 'resources/fonts/Roboto-Regular.ttf'
          const fontInfo = fs.existsSync(fontFile)
            ? `${(fs.statSync(fontFile).size / 1024).toFixed(1)} KB`
            : 'ausente'

          const lines = [
            `## Verificación CI — ${pkg.build?.productName || pkg.name} v${pkg.version}`,
            '',
            '| Comprobación | Resultado |',
            '|---|---|',
            `| Tipos (\`npm run typecheck\`) | \`${process.env.OUTCOME_TYPECHECK}\` |`,
            `| Tests (\`npm test -- --run\`) | \`${process.env.OUTCOME_TEST}\` |`,
            `| Build (\`npm run build\`) | \`${process.env.OUTCOME_BUILD}\` |`,
            `| Lanzamiento (\`npm run verify:release\`) | \`${process.env.OUTCOME_VERIFY}\` |`,
            '',
            '### Estado de recursos e invariantes de seguridad',
            `- \`src/main/index.ts\` (invariantes Electron): ${checkElectronSecurity('src/main/index.ts')}`,
            `- \`resources/icon.png\`: ${checkPng('resources/icon.png')}`,
            `- \`resources/icon-512.png\`: ${checkPng('resources/icon-512.png')}`,
            `- \`resources/icon.ico\`: ${checkIco('resources/icon.ico')}`,
            `- \`resources/logo-mark.svg\`: ${checkSvg('resources/logo-mark.svg')}`,
            `- \`resources/logo-banner.svg\`: ${checkSvg('resources/logo-banner.svg')}`,
            `- \`resources/fonts/Roboto-Regular.ttf\`: ${fontInfo}`,
            ''
          ]

          fs.appendFileSync(summaryPath, lines.join('\n'), 'utf8')
          EOF
