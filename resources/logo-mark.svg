<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="estrato-mark-title">
  <title id="estrato-mark-title">Estrato — Isotipo</title>
  <defs>
    <!-- Gradiente vertical de tinta cálida (sincronizado con scripts/generate-icon.js) -->
    <linearGradient id="estrato-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d22" />
      <stop offset="100%" stop-color="#0d0f12" />
    </linearGradient>

    <!-- Recorte para que el filo superior iluminado respete las esquinas redondeadas -->
    <clipPath id="estrato-clip-top">
      <rect x="110.08" y="140.8" width="291.84" height="64" rx="11.264" />
    </clipPath>
    <clipPath id="estrato-clip-mid">
      <rect x="140.8" y="227.84" width="230.4" height="64" rx="11.264" />
    </clipPath>
    <clipPath id="estrato-clip-low">
      <rect x="176.64" y="314.88" width="158.72" height="64" rx="11.264" />
    </clipPath>
  </defs>

  <!-- Fondo cuadrado redondeado -->
  <rect x="0" y="0" width="512" height="512" rx="94.72" fill="url(#estrato-bg)" />

  <!-- Anillo interior sutil -->
  <rect
    x="12.288"
    y="12.288"
    width="487.424"
    height="487.424"
    rx="87.04"
    fill="none"
    stroke="#3a3f48"
    stroke-width="6.144"
  />

  <!-- Estrato superior -->
  <rect x="110.08" y="140.8" width="291.84" height="64" rx="11.264" fill="#e0a45c" />
  <rect
    x="110.08"
    y="140.8"
    width="291.84"
    height="9.216"
    fill="#f0c48a"
    fill-opacity="0.85"
    clip-path="url(#estrato-clip-top)"
  />

  <!-- Estrato medio -->
  <rect x="140.8" y="227.84" width="230.4" height="64" rx="11.264" fill="#c9873f" />
  <rect
    x="140.8"
    y="227.84"
    width="230.4"
    height="8.192"
    fill="#f0c48a"
    fill-opacity="0.5"
    clip-path="url(#estrato-clip-mid)"
  />

  <!-- Estrato inferior -->
  <rect x="176.64" y="314.88" width="158.72" height="64" rx="11.264" fill="#965f2a" />
  <rect
    x="176.64"
    y="314.88"
    width="158.72"
    height="7.168"
    fill="#f0c48a"
    fill-opacity="0.3"
    clip-path="url(#estrato-clip-low)"
  />
</svg>
